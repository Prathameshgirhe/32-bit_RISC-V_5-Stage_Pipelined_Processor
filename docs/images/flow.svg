<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" width="1200" height="270" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#140f33"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><rect width="1200" height="270" rx="20" fill="url(#bg)"/><text x="600" y="42" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#e2e8f0">Design → Verify → Synthesize</text><rect x="25" y="95" width="190" height="100" rx="14" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-width="2"><animate attributeName="fill-opacity" values="0.1;0.6;0.1;0.1" keyTimes="0;0.08;0.2;1" dur="5s" begin="0.0s" repeatCount="indefinite"/></rect><text x="120" y="138" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="800" fill="#38bdf8">1  Testbench</text><text x="120" y="165" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#cbd5e1">20+ directed tests</text><path d="M221 145 H259" stroke="#64748b" stroke-width="3" marker-end="url(#ar)"/><rect x="265" y="95" width="190" height="100" rx="14" fill="#a78bfa" fill-opacity="0.1" stroke="#a78bfa" stroke-width="2"><animate attributeName="fill-opacity" values="0.1;0.6;0.1;0.1" keyTimes="0;0.08;0.2;1" dur="5s" begin="0.8s" repeatCount="indefinite"/></rect><text x="360" y="138" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="800" fill="#a78bfa">2  RTL Core</text><text x="360" y="165" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#cbd5e1">Verilog RV32I</text><path d="M461 145 H499" stroke="#64748b" stroke-width="3" marker-end="url(#ar)"/><rect x="505" y="95" width="190" height="100" rx="14" fill="#f472b6" fill-opacity="0.1" stroke="#f472b6" stroke-width="2"><animate attributeName="fill-opacity" values="0.1;0.6;0.1;0.1" keyTimes="0;0.08;0.2;1" dur="5s" begin="1.6s" repeatCount="indefinite"/></rect><text x="600" y="138" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="800" fill="#f472b6">3  Checker</text><text x="600" y="165" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#cbd5e1">expected vs actual regs</text><path d="M701 145 H739" stroke="#64748b" stroke-width="3" marker-end="url(#ar)"/><rect x="745" y="95" width="190" height="100" rx="14" fill="#fbbf24" fill-opacity="0.1" stroke="#fbbf24" stroke-width="2"><animate attributeName="fill-opacity" values="0.1;0.6;0.1;0.1" keyTimes="0;0.08;0.2;1" dur="5s" begin="2.4000000000000004s" repeatCount="indefinite"/></rect><text x="840" y="138" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="800" fill="#fbbf24">4  Simulation</text><text x="840" y="165" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#cbd5e1">QuestaSim / Vivado Sim</text><path d="M941 145 H979" stroke="#64748b" stroke-width="3" marker-end="url(#ar)"/><rect x="985" y="95" width="190" height="100" rx="14" fill="#34d399" fill-opacity="0.1" stroke="#34d399" stroke-width="2"><animate attributeName="fill-opacity" values="0.1;0.6;0.1;0.1" keyTimes="0;0.08;0.2;1" dur="5s" begin="3.2s" repeatCount="indefinite"/></rect><text x="1080" y="138" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="800" fill="#34d39