<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#111a33"/></linearGradient><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#38bdf8"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1000" height="460" rx="20" fill="url(#bg)"/><text x="500" y="44" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="28" font-weight="800" fill="#e2e8f0">Results at a Glance</text><g transform="translate(190,240) rotate(-90)"><circle r="90" fill="none" stroke="#1e293b" stroke-width="18"/><circle r="90" fill="none" stroke="url(#rg)" stroke-width="18" stroke-linecap="round" stroke-dasharray="565.49" stroke-dashoffset="565.49" filter="url(#glow)"><animate attributeName="stroke-dashoffset" values="565.49;407.15;407.15;565.49" keyTimes="0;0.3;0.9;1" dur="7s" repeatCount="indefinite"/></circle></g><text x="190" y="248" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="46" font-weight="900" fill="#fff">28%</text><text x="190" y="274" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#94a3b8">fewer pipeline stalls</text><text x="190" y="372" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#64748b">vs. baseline without forwarding</text><text x="390" y="100" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#e2e8f0">Directed instruction tests</text><text x="960" y="100" text-anchor="end" font-family="'JetB